name: Vigilar reformas CPEUM

# Vigila el PDF oficial de la Constitución y abre un PR cuando el texto vigente
# cambia (= hubo una reforma publicada en el DOF). La detección de cambios la
# hace git: se regenera el texto y se compara; NO se comparan bytes del PDF.
#
# El PR trae solo el texto + metadata (regeneración determinista y gratuita).
# El enriquecimiento por LLM (que cuesta) se corre a mano tras aprobar.

on:
  schedule:
    - cron: '0 9 * * 1'        # cada lunes 09:00 UTC
  workflow_dispatch: {}         # también disparo manual

permissions:
  contents: write               # crear la rama y commitear
  pull-requests: write          # abrir el PR

env:
  # Repo del extractor (código).
  EXTRACTOR_REPO: https://github.com/OpenCodice/constitucion-extractor.git
  PDF_URL: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf
  # Opcional: si defines el secret OPENAI_API_KEY, el Action también regenera el
  # enriquecimiento de los artículos cambiados (best-effort). Si no, se omite.
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TIENE_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo de datos
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Clonar extractor e instalar dependencias
        run: |
          git clone --depth 1 "$EXTRACTOR_REPO" /tmp/extractor
          pip install -r /tmp/extractor/requirements.txt

      - name: Descargar el PDF vigente
        run: curl -sSL --retry 3 -o /tmp/CPEUM.pdf "$PDF_URL"

      - name: Regenerar texto + metadata desde el PDF
        run: |
          cd /tmp/extractor
          PYTHONPATH=/tmp/extractor python -m extractor build \
            --pdf /tmp/CPEUM.pdf --out "$GITHUB_WORKSPACE"

      - name: Agente — verificar contra el PDF y reparar el extractor si hace falta
        timeout-minutes: 90
        if: env.TIENE_CLAUDE == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ''
          PDF: /tmp/CPEUM.pdf
          OUT: ${{ github.workspace }}
          PERFIL: cpeum
        run: bash /tmp/extractor/scripts/agente/correr.sh

      - name: Compuertas del agente y veredicto
        id: agente
        if: env.TIENE_CLAUDE == 'true'
        env:
          EXTRACTOR_TOKEN: ${{ secrets.PR_TOKEN }}
          EXTRACTOR_SLUG: OpenCodice/constitucion-extractor
          REPORTE: /tmp/verificacion.md
          PDF: /tmp/CPEUM.pdf
          OUT: ${{ github.workspace }}
          PERFIL: cpeum
        run: |
          if bash /tmp/extractor/scripts/agente/cerrar.sh; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar la extracción contra el PDF (LLM, respaldo sin agente)
        id: verificar
        if: env.TIENE_CLAUDE != 'true' && env.OPENAI_API_KEY != ''
        env:
          VERIFICADOR_MODELO: ${{ vars.VERIFICADOR_MODELO }}
          VERIFICADOR_MODELO_FUERTE: ${{ vars.VERIFICADOR_MODELO_FUERTE }}
        run: |
          if [ -z "$(git status --porcelain -- articulos)" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install openai
          cd /tmp/extractor
          if PYTHONPATH=/tmp/extractor python -m extractor verificar \
               --pdf /tmp/CPEUM.pdf --out "$GITHUB_WORKSPACE" \
               --reparar --reporte /tmp/verificacion.md; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Veredicto de verificación
        id: veredicto
        run: echo "ok=${{ steps.agente.outputs.ok || steps.verificar.outputs.ok }}" >> "$GITHUB_OUTPUT"

      - name: ¿Cambió el texto vigente?
        id: cambios
        run: |
          # Una reforma = cambió el TEXTO LEGAL de los artículos. Miramos solo
          # `articulos/` a propósito: cambios de metadata/esquema (p. ej. un campo
          # nuevo en pasajes.jsonl) regeneran el árbol pero NO son una reforma y
          # no deben abrir un PR de "reforma".
          if [ -n "$(git status --porcelain -- articulos fuente/ruido.json)" ]; then
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"
            git status --short -- articulos
          else
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
            echo "Sin reforma: el texto de los artículos coincide con el repo."
            if [ -n "$(git status --porcelain)" ]; then
              echo "Nota: hay diffs solo de metadata/esquema (no reforma):"
              git status --short
            fi
          fi

      - name: Enriquecer artículos cambiados (opcional, best-effort)
        # Solo si hay reforma y está configurado el secret OPENAI_API_KEY.
        # continue-on-error: un fallo del LLM no debe tumbar el PR del texto.
        if: steps.cambios.outputs.hay_cambios == 'true' && env.OPENAI_API_KEY != ''
        continue-on-error: true
        run: |
          pip install openai
          cd /tmp/extractor
          PYTHONPATH=/tmp/extractor python -m extractor enriquecer \
            --pdf /tmp/CPEUM.pdf --out "$GITHUB_WORKSPACE" --proveedor openai

      - name: Actualizar el PDF fuente (solo si hubo reforma)
        # Va en el mismo commit que las coordenadas regeneradas → PDF y datos
        # quedan sincronizados atómicamente (lo consume constitucion-web → R2).
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          mkdir -p fuente
          cp /tmp/CPEUM.pdf fuente/CPEUM.pdf

      - name: Generar cuerpo del PR
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          python /tmp/extractor/scripts/pr_summary.py "$GITHUB_WORKSPACE" > /tmp/cuerpo.md
          if [ -f /tmp/verificacion.md ]; then
            { echo; cat /tmp/verificacion.md; } >> /tmp/cuerpo.md
          fi
          cat /tmp/cuerpo.md

      - name: Abrir Pull Request
        id: pr
        if: steps.cambios.outputs.hay_cambios == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Con un PAT (secret PR_TOKEN) el PR nace atribuido a un usuario real,
          # así dispara `revisar-pr` (gate + resumen) como un PR humano. Si el
          # secret no existe, cae al GITHUB_TOKEN (el PR se abre pero sin checks).
          token: ${{ secrets.PR_TOKEN || github.token }}
          branch: reforma/cpeum-deteccion-automatica
          base: main
          title: '🏛️ Posible reforma a la CPEUM (detección automática)'
          body-path: /tmp/cuerpo.md
          commit-message: 'Actualización automática del texto vigente de la CPEUM'
          draft: ${{ steps.veredicto.outputs.ok == 'false' }}
          labels: |
            reforma
            automatico
            ${{ steps.veredicto.outputs.ok == 'false' && 'extraccion-sospechosa' || '' }}
            ${{ steps.veredicto.outputs.ok == 'true' && 'verificado' || '' }}
            ${{ steps.agente.outputs.tipo == 'correccion' && 'correccion-extraccion' || '' }}
          assignees: ${{ steps.veredicto.outputs.ok == 'false' && 'danielcardeenas' || '' }}
          delete-branch: true

      - name: Sincronizar el estado de verificación del PR
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN || github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          OK: ${{ steps.veredicto.outputs.ok }}
        run: |
          if [ "$OK" = "true" ]; then
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --remove-label extraccion-sospechosa || true
            gh pr ready "$PR" -R "$GITHUB_REPOSITORY" || true
          else
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --remove-label verificado || true
          fi

  salud:
    needs: vigilar
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mantener activo el cron
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/vigilar-cpeum.yml/enable"

      - name: Abrir o actualizar un issue si falló
        if: needs.vigilar.result == 'failure'
        run: |
          titulo="🚨 Falló: ${{ github.workflow }}"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
                --search "in:title \"$titulo\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "Volvió a fallar: $url"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$titulo" \
              --assignee danielcardeenas \
              --body "El workflow programado falló y necesita atención: $url"
          fi
