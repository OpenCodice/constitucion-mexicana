name: Revisar PR de reforma

# Se ejecuta en cada PR. Dos partes:
#   validar  — invariantes deterministas. Es el GATE: si falla, no se debe mergear
#              (actívalo como required check en branch protection).
#   resumir  — comentario asistido por LLM con resumen + banderas de corrupción.
#              Es solo apoyo de revisión (no decide).

on:
  pull_request: {}

permissions:
  contents: read
  pull-requests: write

env:
  EXTRACTOR_REPO: https://github.com/OpenCodice/constitucion-extractor.git
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Clonar extractor e instalar dependencias
        run: |
          git clone --depth 1 "$EXTRACTOR_REPO" /tmp/extractor
          pip install -r /tmp/extractor/requirements.txt
      - name: Validar invariantes (GATE)
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          cd /tmp/extractor
          PYTHONPATH=/tmp/extractor python -m extractor validar \
            --out "$GITHUB_WORKSPACE" --base "origin/${{ github.base_ref }}"

  resumir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Clonar extractor e instalar OpenAI
        run: |
          git clone --depth 1 "$EXTRACTOR_REPO" /tmp/extractor
          pip install openai
      - name: Resumir cambios y comentar el PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Sin OPENAI_API_KEY: omito el resumen asistido."; exit 0
          fi
          git fetch -q origin "${{ github.base_ref }}"
          python /tmp/extractor/scripts/resumir_pr.py \
            "$GITHUB_WORKSPACE" "origin/${{ github.base_ref }}" > /tmp/resumen.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body-file /tmp/resumen.md

  fusionar:
    needs: validar
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'reforma/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fusionar si la extracción quedó verificada
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Sin PR_TOKEN: el PR queda para revisión manual."; exit 0
          fi
          estado=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json isDraft,labels \
            -q '"\(.isDraft) \([.labels[].name] | join(","))"')
          case "$estado" in
            true*|*extraccion-sospechosa*) echo "Extracción sospechosa: no se fusiona."; exit 0 ;;
            *verificado*) ;;
            *) echo "Sin etiqueta 'verificado': no se fusiona."; exit 0 ;;
          esac
          git fetch -q origin "${{ github.base_ref }}"
          archivos=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'articulos/*.md')
          n=$(echo "$archivos" | grep -c . || true)
          if [ "$n" -gt 12 ]; then
            arts="$n artículos"
          else
            arts="arts. $(echo "$archivos" | sed -E 's|.*/0*([0-9]+)(-[a-z]+)?\.md$|\1\2|' | paste -sd, - | sed 's/,/, /g')"
          fi
          ver=$(jq -r '.version // empty' metadata/articulos.json)
          asunto="Reforma CPEUM${ver:+ (DOF $ver)}: $arts"
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --delete-branch \
            --subject "$asunto" --body "Fusionado automáticamente: validación e inspección LLM contra el PDF oficial en verde (#$PR)."
